# Toolchain shared by every course in this repository. Each course pins its own
# tools in a mise.toml inside its folder, and mise merges that file with this
# one.
#
# Install everything with:  mise install   (from inside a course folder)
# Activate per shell with:  eval "$(mise activate zsh)"
#
# Versions are pinned so that every terminal behaves the same way.

[tools]
# Runs the commit hooks in .pre-commit-config.yaml.
pre-commit = "4.6"
